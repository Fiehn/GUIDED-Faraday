base: base.yaml

normalization:
  method: none  # original paper uses raw kWh; change to log1p for fair cross-model comparison

model:
  type: faraday
  latent_dim: 128
  encoder:
    type: mlp  # Faraday always uses MLP; the type field is ignored at runtime
    hidden_dims: [512, 512, 1024, 256, 128]
  decoder:
    type: mlp
    hidden_dims: [128, 256, 1024, 512, 512]

  faraday:
    mse_weight: 1.0
    mmd_weight: 100.0
    upper_quantile_weight: 1.0
    lower_quantile_weight: 1.0
    median_quantile_weight: 1.0

  gmm:
    n_components: 300
    covariance_type: full
    max_iter: 100

conditioning:
  tags: [day_of_week, month_of_year, heatpump_phase, ev, pv] # user_profile, 