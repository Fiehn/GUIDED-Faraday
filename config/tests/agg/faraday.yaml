# Faraday baseline override config for aggregated (hourly) data experiments.
# Reference: Chai & Chadney, ICLR 2024 Workshop; OpenSynth Apache-2.0 implementation.
#
# Normalization default: none — matches the original paper, which trains on raw kWh values.
# For cross-model comparison within the thesis, override with:
#   normalization:
#     method: log1p
# to place Faraday on the same footing as CVAE and other thesis models.

base: base.yaml

normalization:
  method: none  # original paper uses raw kWh; change to log1p for fair cross-model comparison

model:
  type: faraday
  latent_dim: 32
  encoder:
    type: mlp  # Faraday always uses MLP; the type field is ignored at runtime
    hidden_dims: [512, 256, 128, 64, 32]
  decoder:
    type: mlp
    hidden_dims: [32, 64, 128, 256, 512]

  faraday:
    mse_weight: 1.0
    mmd_weight: 100.0
    upper_quantile_weight: 1.0
    lower_quantile_weight: 1.0
    median_quantile_weight: 1.0

  gmm:
    n_components: 300
    covariance_type: full
    max_iter: 100