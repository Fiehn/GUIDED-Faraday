base: base.yaml

model:
  type: baseline_real_data
  reservoir_size: 500000
  min_bucket_samples: 30

normalization:
  method: null
  cache_dir: null
  force_recompute: false
  log1p:
    epsilon: 1.0e-6

training:
  num_epochs: 30
  checkpointing:
    save_freq: 1
    save_dir: E:/models/new4/
    save_best_model: false
    save_best_after_fraction: 0.00
    save_final_model: true
  early_stopping:
    enabled: false
    stop_on_all_files_used: true
    min_epochs_before_full_data_stop: 1
    patience: 7
    min_delta: 0.001