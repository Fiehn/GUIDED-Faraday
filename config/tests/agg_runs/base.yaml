# Shared base config for aggregated (hourly) data experiments.
# Machine-specific: edit data.data_dir for your machine.
# Override configs reference this file via `base: base.yaml`.

data:
  mode: csv
  data_dir: "data/_parquet_cache" # E:/Data/processed_data/hourly_data/_parquet_cache
  data_files: []
  columns:
    meter_id: meter_number
    timestamp_dst: timestamp_dst
    timestamp_utc: timestamp_utc
    value_cols: [hourly_energy_consumption]
  nan_as_zero: false
  max_value: 200.0
  max_hour_value: 20.0
  splits:
    train_ratio: 0.8
    val_ratio: 0.1
    test_ratio: 0.1
    random_seed: 42
  window:
    aggregated: true
    input_len: 24
    stride: 24
  batch_size: 2048
  shuffle: true
  replay_buffer_capacity: 10000
  min_buffer_size: 3000
  num_workers: 8
  steps_per_epoch: 500
  eval_batches: 5
  eval_cache_on_gpu: true
  eval_cache_refresh: false
  cache_scan_batches: 0
  skip_corrupt_files: true
  max_skip_warnings: 20
  aggregation_energy_unit: kwh
  output_aggregate_stream: false
  in_memory: true
  max_passes: 20

normalization:
  method: log1p
  cache_dir: null
  force_recompute: false
  log1p:
    epsilon: 1.0e-6

model:
  type: baseline_mean
  latent_dim: 64
  encoder:
    type: dictionary
    hidden_dims: [256, 512, 1024, 256, 128]
    dropout: 0.2
  decoder:
    type: dictionary
    hidden_dims: [128, 256, 512, 1024, 256]
    dropout: 0.2
  prior:
    type: learnable_dictionary
    dictionary_size: 256
    vamp_num_components: 40
    init_from_data: true
    init_noise_scale: 0.01
  phase_splitter:
    base_channels: 64
    temperature: 2.0
  set:
    hidden_dim: 256
    num_heads: 4
    num_inds: 16
    num_blocks: 2
    num_features: 3
    is_isab: true
    use_abl_pool: false
  art:
    num_bins: 64
    transformer_num_heads: 8
    transformer_num_layers: 4
    d_model: 64
  diffusion:
    num_timesteps: 200
    schedule_type: cosine
    cosine_s: 0.008
    max_beta: 0.999
    beta_start: 1.0e-4
    beta_end: 0.02
    time_dim: 128
    base_channels: 128
    num_blocks: 16
    self_attention_heads: 16
    use_condition_cross_attention: true
    condition_cross_attention_heads: 16
    condition_tokens: 16
    condition_dropout_prob: 0.10
    reconstruction_noise_fraction: 0.30
    deterministic_reconstruction: true

conditioning:
  tags: [day_of_week, month_of_year, user_profile, heatpump_phase, ev, pv]
  user_profile:
    online: false
    n_topics: 40
    num_clusters: 200
    random_state: 42
    cache_path: ./models/UserProfiles/user_profiles.pkl
    verbose: false
  online_user_profile:
    decay: 0.95
  ev_phase:
    path: data/EV/EV_detection_reduced_60000_SM.csv

hierarchy:
  enabled: false
  levels: [linear, linear, linear]
  latent_dims: [64, 32, 16]
  top_down: [false, false, false]
  bottom_up: [false, false, false]
  loss_weights: [1.0, 1.0, 1.0]
  aggregation: concat
  bidirectional: false
  residual_connections: false
  kl_annealing: true
  kl_warmup_steps: 1000
  free_bits: 0.1

training:
  optimizer: adam
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  gradient_clip: true
  gradient_clip_max_norm: 1.0
  lr_scheduler:
    enabled: true
    scheduler_type: cosine
    step_size: 10
    gamma: 0.9
  num_epochs: 100
  beta: 1.0
  beta_annealing:
    enabled: true
    n_cycles: 1
    ratio: 0.25
  weighted_loss: 0.2
  early_stopping:
    enabled: true
    stop_on_all_files_used: false
    min_epochs_before_full_data_stop: 1
    patience: 5
    min_delta: 0.001
  checkpointing:
    save_freq: 20
    save_dir: ./models/new/
    save_best_model: true
    save_best_after_fraction: 0.00
    save_final_model: true

logging:
  log_dir: ./models/new/
  save_config: true
  config_save_dir: ./models/new/

visualize:
  num_samples: 5
  num_recon_per: 5
  num_synthetic: 40
  num_originals: 4
  num_synthetic_per: 10
