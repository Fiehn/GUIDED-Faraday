base: base.yaml

data:
  batch_size: 256
  eval_cache_on_gpu: false
  num_workers: 8

model:
  type: art
  latent_dim: 128
  encoder:
    type: dictionary
    hidden_dims: [128, 256, 128]
    dropout: 0.2
  decoder:
    type: dictionary
    hidden_dims: [128, 256, 128]
    dropout: 0.2
  prior:
    type: learnable_dictionary
    dictionary_size: 256
    vamp_num_components: 20
    init_from_data: true
    init_noise_scale: 0.01
  art:
    num_bins: 128
    transformer_num_heads: 4
    transformer_num_layers: 2
    d_model: 128