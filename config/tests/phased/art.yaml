base: base.yaml

data:
  num_workers: 8

model:
  type: art
  latent_dim: 128
  encoder:
    type: dictionary
    hidden_dims: [256, 512, 1024, 256, 128]
    dropout: 0.2
  decoder:
    type: dictionary
    hidden_dims: [128, 256, 512, 1024, 256]
    dropout: 0.2
  prior:
    type: learnable_dictionary
    dictionary_size: 256
    vamp_num_components: 40
    init_from_data: true
    init_noise_scale: 0.01
  art:
    num_bins: 256
    transformer_num_heads: 8
    transformer_num_layers: 4
    d_model: 256