base: base.yaml

training:
  lr_scheduler:
    scheduler_type: exponential
    gamma: 0.95
  beta_annealing:
    enabled: false
  weighted_loss: 0.0

model:
  type: sequential_vae
  latent_dim: 256
  encoder:
    type: dictionary
    hidden_dims: [192, 512, 192]
    dropout: 0.2
  decoder:
    type: dictionary
    hidden_dims: [192, 512, 192]
    dropout: 0.2
  prior:
    type: learnable_dictionary
    dictionary_size: 512
    vamp_num_components: 20
    init_from_data: true
    init_noise_scale: 0.01