base: base.yaml

data:
  batch_size: 256
  eval_cache_on_gpu: false
  columns:
    value_cols: [phase_1, phase_2, phase_3]

conditioning:
  heatpump_phase:
    path: data/HP/label_propagation_predictions.csv

training:
  lr_scheduler:
    scheduler_type: exponential
    gamma: 0.95
  beta_annealing:
    enabled: false
  weighted_loss: 0.0

logging:
  log_dir: models/sequential_phase_vae
  config_save_dir: models/sequential_phase_vae

model:
  type: sequential_vae
  latent_dim: 256
  encoder:
    type: dictionary
    hidden_dims: [128, 256, 128]
    dropout: 0.2
  decoder:
    type: dictionary
    hidden_dims: [128, 256, 128]
    dropout: 0.2
  prior:
    type: learnable_dictionary
    dictionary_size: 128
    vamp_num_components: 20
    init_from_data: true
    init_noise_scale: 0.01