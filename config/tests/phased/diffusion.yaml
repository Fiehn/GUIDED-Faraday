base: base.yaml

data:
  batch_size: 256
  eval_cache_on_gpu: false

model:
  type: diffusion
  diffusion:
    num_timesteps: 200
    schedule_type: cosine
    cosine_s: 0.008
    max_beta: 0.999
    beta_start: 1.0e-4
    beta_end: 0.02
    time_dim: 64
    base_channels: 64
    num_blocks: 8
    self_attention_heads: 8
    use_condition_cross_attention: true
    condition_cross_attention_heads: 8
    condition_tokens: 8
    condition_dropout_prob: 0.10
    reconstruction_noise_fraction: 0.30
    deterministic_reconstruction: true