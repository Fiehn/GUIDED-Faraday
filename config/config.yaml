# ============================================================================
# Configuration File
# ============================================================================
# This configuration file centralizes all parameters for model training,
# data loading, and conditioning. 

# ============================================================================
# DATA LOADING CONFIGURATION
# ============================================================================
data:
  # Directory where CSV files are stored
  data_dir: "./data"
  
  # CSV filename to load
  filename: "hourly_measurements_2023_10.csv"
  
  # CSV column specifications
  columns:
    meter_id: "meter_number"
    timestamp_dst: "timestamp_dst"
    timestamp_utc: "timestamp_utc"
    value_cols: ["hourly_energy_consumption", "hourly_energy_production"]  # List of measurement columns
  
  # Data loading options
  nan_as_zero: true
  dtype_meter: "int32"
  dtype_values: "float32"
  
  # Train/val/test split (by meter ID)
  splits:
    train_ratio: 0.7
    val_ratio: 0.15
    test_ratio: 0.15
    random_seed: 42
  
  # Windowing configuration
  window:
    input_len: 24  # 24-hour windows
    stride: 24     # Non-overlapping windows (one per day)
    drop_nan_windows: true
  
  # DataLoader settings
  dataloader:
    batch_size: 64
    num_workers: 0
    pin_memory: false
    persistent_workers: false

# ============================================================================
# NORMALIZATION CONFIGURATION
# ============================================================================
normalization:
  # Type of normalization: "log1p", "student_t", "zero_preserved_log"
  method: "log1p"
  
  # Log1p specific parameters
  log1p:
    epsilon: 1.0e-6
  
  # For online learning (RevIN in OnlineCVAE)
  revin:
    enabled: false
    affine: true

# ============================================================================
# MODEL ARCHITECTURE CONFIGURATION
# ============================================================================
model:
  # Model type: "vae", "cvae", "online_cvae"
  type: "cvae"
  
  # Device for training: "cpu" or "cuda"
  device: "cuda"
  
  # Input dimension (will be auto-calculated: 24 hours * num_features)
  # Set to null to auto-detect from data, or specify manually
  input_dim: null
  
  # Latent dimension (size of latent vector z)
  latent_dim: 32
  
  # Encoder configuration
  encoder:
    type: "dictionary"  # Options: "dictionary", "mlp", etc.
    hidden_dims: [512, 256, 128]
    dropout: 0.2
    activation: "relu"
  
  # Decoder configuration
  decoder:
    type: "dictionary"  # Options: "dictionary", "mlp", "gaussian_mlp"
    hidden_dims: [128, 256, 512]
    dropout: 0.2
    activation: "relu"
    likelihood: "gaussian"  # Options: "gaussian", "student_t"
  
  # Prior configuration
  prior:
    type: "standard_dictionary"  # Options: "standard_gaussian", "standard_dictionary", 
                                 # "learnable_gaussian", "learnable_dictionary", "vamp"
    dictionary_size: 100
    vamp_num_components: 20

# ============================================================================
# CONDITIONING CONFIGURATION (for CVAE)
# ============================================================================
conditioning:
  # Enable/disable conditioning
  enabled: true
  
  # User profiling (based on LDA)
  user_profile:
    enabled: true
    n_topics: 10 # number of LDA topics
    num_clusters: 100 # number of KMeans clusters for "words"
    random_state: 42
    cache_path: "./models/UserProfiles/user_profiles.pkl"
    verbose: false
  
  # Day-of-week conditioning
  day_of_week:
    enabled: true
    # 7-dimensional one-hot encoding
  
  # Online user profiling (for OnlineCVAE)
  online_user_profile:
    enabled: false
    decay: 0.95
    update_frequency: 10  # update every N batches

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training:
  # Optimization settings
  optimizer: "adam"  # Options: "adam", "adamw", "sgd"
  
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  
  # Gradient clipping
  gradient_clip: true
  gradient_clip_max_norm: 1.0
  
  # Learning rate scheduler
  lr_scheduler:
    enabled: false
    scheduler_type: "step"  # Options: "step", "exponential", "cosine"
    step_size: 10
    gamma: 0.9
  
  # Number of training epochs
  num_epochs: 50
  
  # Beta (KL weight) settings
  beta: 1.0
  
  # Cyclical beta annealing (prevents KL collapse)
  beta_annealing:
    enabled: true
    n_cycles: 4   
    ratio: 0.5 # fraction of each cycle for warmup (0-1)
  
  # Weighted loss 
  weighted_loss: 0.0  # Set > 0 to enable (e.g., 0.1)
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 15 # stop if no improvement for N validations
    min_delta: 0.001 # minimum improvement threshold
  
  # Validation
  validation:
    enabled: true
    validation_freq: 1 # validate every N epochs
    num_mc_samples: 10 # number of MC samples for validation
  
  # Model checkpointing
  checkpointing:
    save_freq: 10 # save checkpoint every N epochs
    save_dir: "./models"
    save_best_model: true
    save_final_model: true
  
  # Number of latent samples for training
  num_samples: 1

# ============================================================================
# LOGGING AND MONITORING CONFIGURATION
# ============================================================================
logging:
  # TensorBoard settings
  tensorboard:
    enabled: true
    log_dir: "./runs"
  
  # Console logging verbosity: "debug", "info", "warning", "error"
  level: "info"
  
  # Save training configuration
  save_config: true
  config_save_dir: "./models"

# ============================================================================
# SAMPLING CONFIGURATION
# ============================================================================
sampling:
  # Number of samples to generate from prior
  num_prior_samples: 1
  
  # Number of x samples per latent sample
  num_x_samples: 1
  
  # Save synthetic samples
  save_samples: true
  samples_dir: "./Output/synthetic_data"

# ============================================================================
# ADVANCED 
# ============================================================================
advanced:
  # Mixed precision training
  mixed_precision: true
  
  # Number of CPU threads for PyTorch
  num_threads: 0
  
  # Deterministic training
  deterministic: true
  seed: 42
  
  # Profile training performance
  profiling:
    enabled: false
    profile_dir: "./profiles"
