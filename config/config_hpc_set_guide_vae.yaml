
# ============================================================================
# Configuration File (HPC SetGuideVAE)
# ============================================================================
# Use this config after preparing a subset directory that contains only parquet
# files for meter IDs listed in data/meters_from_bachelor.csv.
#
# Helper command:
#   python src/data/prepare_raw_profiles_subset.py \
#     --meters-csv data/meters_from_bachelor.csv \
#     --source-dir data/raw_profiles \
#     --output-dir data/raw_profiles_bachelor6000 \
#     --mode symlink \
#     --clear-output

skip_validation: true
verbose: true

data:
  mode: "phased_parquet"
  data_dir: "./data/raw_profiles_bachelor6000"
  data_files: []  # empty => train.py discovers all subset parquet files recursively

  columns:
    meter_id: "meter_number"
    timestamp_dst: "timestamp_dst"
    timestamp_utc: "timestamp_utc"
    value_cols: ["active_power_p14_l1", "active_power_p14_l2", "active_power_p14_l3"]

  nan_as_zero: true
  dtype_meter: "int32"
  dtype_values: "float32"

  splits:
    train_ratio: 0.90
    val_ratio: 0.05
    test_ratio: 0.05
    random_seed: 42

  window:
    aggregated: true
    input_len: 24
    stride: 24

  dataloader:
    batch_size: 256
    num_workers: 8
    shuffle: false

  phased:
    replay_buffer_capacity: 120000
    min_buffer_size: 24000
    num_workers: 8
    steps_per_epoch: 1000
    eval_batches: 10
    eval_every_n_epochs: 1
    eval_cache_on_gpu: false
    eval_cache_refresh: false
    cache_scan_batches: 0
    skip_corrupt_files: true
    max_skip_warnings: 50
    aggregation_energy_unit: "kwh"

normalization:
  method: "log1p_phase"
  log1p:
    epsilon: 1.0e-6

model:
  type: "set_guide_vae"
  device: "cuda"
  latent_dim: 128

  encoder:
    type: "dictionary_cnn"
    hidden_dims: [512, 512, 256]
    dropout: 0.2
    activation: "relu"

  decoder:
    type: "dictionary_cnn"
    hidden_dims: [256, 512, 512]
    dropout: 0.2
    activation: "relu"
    likelihood: "gaussian"

  prior:
    type: "learnable_dictionary"
    dictionary_size: 512
    vamp_num_components: 40
    init_from_data: true
    init_noise_scale: 0.01

  set:
    hidden_dim: 256
    num_heads: 4
    num_inds: 16
    num_blocks: 2
    num_features: 3
    is_isab: true
    use_abl_pool: false

conditioning:
  # All condition tags currently supported in src/train.py
  tags: ["day_of_week", "month_of_year", "user_profile", "nr_phases_active", "holiday", "heatpump_phase"]

  user_profile:
    online: true
    n_topics: 20
    num_clusters: 200
    random_state: 42
    cache_path: "./models/UserProfiles/user_profiles.pkl"
    verbose: false

  online_user_profile:
    decay: 0.95

hierarchy:
  enabled: false
  levels: ["linear", "linear", "linear"]
  latent_dims: [64, 32, 16]
  top_down: [false, false, false]
  bottom_up: [false, false, false]
  loss_weights: [1.0, 1.0, 1.0]
  aggregation: "concat"
  bidirectional: false
  residual_connections: false
  kl_annealing: true
  kl_warmup_steps: 1000
  free_bits: 0.1

training:
  optimizer: "adam"
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4

  gradient_clip: true
  gradient_clip_max_norm: 1.0

  lr_scheduler:
    enabled: true
    scheduler_type: "cosine"
    step_size: 10
    gamma: 0.9

  num_epochs: 50
  beta: 0.0

  beta_annealing:
    enabled: false
    n_cycles: 2
    ratio: 0.25

  weighted_loss: 0.0

  early_stopping:
    enabled: true
    stop_on_all_files_used: true
    min_epochs_before_full_data_stop: 3
    patience: 8
    min_delta: 0.001

  checkpointing:
    save_freq: 5
    save_dir: "./models"
    save_best_model: true
    save_best_after_fraction: 0.20
    save_final_model: true

  compile_model: false

logging:
  log_dir: "./models/hpc_runs"
  save_config: true
  config_save_dir: "./models/hpc_runs"

visualize:
  num_samples: 5
  num_recon_per: 5
  num_synthetic: 40
  num_originals: 4
  num_synthetic_per: 10

advanced:
  num_threads: 0
  deterministic: true
  seed: 42
  profiling:
    enabled: false
    profile_dir: "./profiles"

