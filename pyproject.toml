[project]
name = "3phase-synthetic-data"
version = "0.1.0"
description = "Conditional generative modeling for statistically representative per-phase smart meter time series"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "graphviz>=0.21",
    "matplotlib>=3.10.8",
    "numba>=0.65.1",
    "pandapower>=3.3.0",
    "pandas>=2.3.3",
    "pyarrow>=23.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "scikit-learn==1.7.2",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
    "tensorboard>=2.20.0",
    "torch>=2.9.1",
    "torchviz>=0.0.3",
    "tqdm>=4.67.1",
    "triton-windows>=3.6.0.post26; sys_platform == 'win32'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# Windows -> CUDA build. Linux/macOS -> PyPI CPU build (default).
# To enable CUDA on Linux, add: { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pyright]
reportMissingImports = false
extraPaths = ["src"]
